[package]
name = "aleph-cli"
version = "0.17.0-rc2"
edition = "2024"
description = "Minimal CLI for Aleph Cloud, built in Rust."
license = "MIT"
repository = "https://github.com/aleph-im/aleph-rs"
homepage = "https://github.com/aleph-im/aleph-rs"

[features]
default = ["vprogram"]
# Verifiable programs (attestable SEV-SNP VMs): `aleph vprogram create`.
# Gated so the CLI's own vprogram command tree can be excluded from stripped-down
# builds, forwarding to aleph-sdk's `vprogram` feature (which pulls in `sev`).
vprogram = ["aleph-sdk/vprogram"]

[dependencies]
aleph-sdk = { workspace = true, features = ["account-evm", "account-sol", "credits", "swap"] }
alloy-network = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-signer-local = { workspace = true }
aleph-types = { workspace = true, features = ["account"] }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = "4.5"
memsizes = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
url = { workspace = true }
directories = { workspace = true }
rpassword = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
k256 = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tokio-stream = { workspace = true }
bytes = { workspace = true }
zeroize = { workspace = true }
coins-ledger = { workspace = true }
dialoguer = { workspace = true, features = ["fuzzy-select"] }
bs58 = { workspace = true }
walkdir = { workspace = true }
which = { workspace = true }
ctrlc = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
scrypt = { workspace = true }
pbkdf2 = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
sha3 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[dev-dependencies]
tempfile = { workspace = true }
heph = { path = "../heph" }
# actix-web's default feature set minus `http2`. Dropping it removes the
# optional `h2 0.3` dependency of actix-http from the lockfile entirely, which
# clears RUSTSEC-2026-0258 for a line of h2 that will never be patched (0.3
# ended at 0.3.27; the advisory is only fixed in >= 0.4.16). Nothing here
# enables a TLS feature, so the server only ever spoke cleartext HTTP/1.1 to
# real clients anyway: `http2` bought us prior-knowledge h2c, which no browser
# or ordinary client negotiates.
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
wiremock = { workspace = true }
insta = { version = "1", features = ["json"] }

[package.metadata.deb]
maintainer = "Aleph.im <contact@aleph.im>"
section = "utils"
priority = "optional"
assets = [
    ["target/release/aleph", "usr/bin/", "755"],
]

[[bin]]
name = "aleph"
path = "src/main.rs"
