[package]
name = "heph"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "heph"
path = "src/main.rs"

[dependencies]
aleph-types = { path = "../aleph-types", features = ["account-evm", "signature-sol"] }
aleph-sdk = { path = "../aleph-sdk" }
# actix-web's default feature set minus `http2`. Dropping it removes the
# optional `h2 0.3` dependency of actix-http from the lockfile entirely, which
# clears RUSTSEC-2026-0258 for a line of h2 that will never be patched (0.3
# ended at 0.3.27; the advisory is only fixed in >= 0.4.16). Nothing here
# enables a TLS feature, so the server only ever spoke cleartext HTTP/1.1 to
# real clients anyway: `http2` bought us prior-knowledge h2c, which no browser
# or ordinary client negotiates.
actix-web = { version = "4", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "compress-zstd",
    "cookies",
    "unicode",
    "compat",
    "ws",
] }
actix-cors = "0.7"
actix-multipart = "0.7"
rusqlite = { version = "0.34", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

futures-util = "0.3"
tempfile = "3"

[dev-dependencies]
aleph-sdk = { path = "../aleph-sdk" }
reqwest = { version = "0.13", features = ["json"] }
url = "2"
